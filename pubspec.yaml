name: tajweed_ai
description: "A new Flutter project."
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cg_core_defs:
    path: packages/cg_core_defs
  generic_requester:
    path: packages/generic_requester

  get_it: ^8.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.1.0
  connectivity_plus: ^6.1.5
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  country_picker: ^2.0.27
  pinput: ^5.0.1
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5
  html: ^0.15.6
  path: ^1.9.1
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  drift_dev: ^2.28.1
  build_runner: ^2.7.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/json/
    - assets/fonts/
    - assets/db/prebuilt.db
  fonts:
    - family: SurahNameV4
      fonts:
        - asset: assets/fonts/surah-name-v4/surah-name-v4.ttf

    - family: UthmanicHafsV17
      fonts:
        - asset: assets/fonts/hafs-fonts/UthmanicHafs1-Ver17.ttf

    - family: UthmanicHafsV18
      fonts:
        - asset: assets/fonts/hafs-fonts/UthmanicHafs1Ver18.ttf

#= Flutter Launcher Icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/tajweed_ai_icon.png"
  min_sdk_android: 26
  remove_alpha_ios: true

#= Flutter Native Splash
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/tajweed_ai_splash.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: assets/images/tajweed_ai_splash.png
    color: "#FFFFFF"
  web: false
#= drift config
drift:
  options:
    generate_json_serialization: true
